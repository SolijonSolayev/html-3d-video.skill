<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>3D Video Starter</title>
  <style>
    :root { color-scheme: dark; font: 15px/1.5 system-ui, sans-serif; background: #080b14; color: #edf2ff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 1120px); }
    h1 { margin: 0 0 12px; font-size: clamp(1.3rem, 3vw, 2rem); }
    .stage { position: relative; overflow: hidden; aspect-ratio: 16 / 9; border: 1px solid #29334b; border-radius: 14px; background: #10182a; box-shadow: 0 20px 70px #0008; }
    canvas { display: block; width: 100%; height: 100%; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 14px; }
    button { border: 1px solid #4b5c82; border-radius: 8px; padding: 9px 14px; background: #17233c; color: inherit; font: inherit; cursor: pointer; }
    button:hover { background: #223455; }
    button:focus-visible { outline: 3px solid #7edbff; outline-offset: 2px; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { min-height: 1.5em; color: #b6c4df; }
    .hint { color: #9eacc8; font-size: .9rem; }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
  </script>
</head>
<body>
  <main>
    <h1>3D Video Starter</h1>
    <p class="hint">Replace the procedural scene and timeline below with the requested concept.</p>
    <div class="stage" id="stage" aria-label="Animated 3D scene preview"></div>
    <div class="controls">
      <button id="replay" type="button">Replay</button>
      <button id="record" type="button">Record 8-second WebM</button>
      <span id="status" role="status" aria-live="polite">Loading scene…</span>
    </div>
    <p class="hint">Recording is real-time. Browser and codec support vary. Use a local web server to run this page.</p>
  </main>
  <script type="module">
    import * as THREE from 'three';

    const DURATION = 8;
    const FPS = 30;
    const OUTPUT = { width: 1920, height: 1080 };
    const stage = document.querySelector('#stage');
    const status = document.querySelector('#status');
    const recordButton = document.querySelector('#record');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#10182a');
    scene.fog = new THREE.Fog('#10182a', 8, 22);

    const camera = new THREE.PerspectiveCamera(38, 16 / 9, 0.1, 100);
    camera.position.set(0, 1.1, 7.5);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(stage.clientWidth, stage.clientHeight, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    stage.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xa6c8ff, 0x171323, 2));
    const key = new THREE.DirectionalLight(0xffd7a1, 3.2);
    key.position.set(-3, 5, 4);
    scene.add(key);
    const rim = new THREE.PointLight(0x5c7cff, 24, 12);
    rim.position.set(3, 1, -3);
    scene.add(rim);

    const object = new THREE.Mesh(
      new THREE.TorusKnotGeometry(0.95, 0.27, 180, 28),
      new THREE.MeshStandardMaterial({ color: 0x70d7ff, metalness: 0.68, roughness: 0.22 })
    );
    scene.add(object);

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(8, 80),
      new THREE.MeshStandardMaterial({ color: 0x111a2d, metalness: 0.15, roughness: 0.8 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1.6;
    scene.add(floor);

    const clock = new THREE.Clock();
    let playing = true;
    let startTime = clock.getElapsedTime();
    let recording = false;

    function clamp01(value) { return Math.max(0, Math.min(1, value)); }
    function smoothstep(value) { const x = clamp01(value); return x * x * (3 - 2 * x); }

    function renderAt(time) {
      const t = Math.max(0, Math.min(DURATION, time));
      const reveal = smoothstep(t / 1.4);
      object.rotation.set(0.12 * Math.sin(t * 0.7), t * 0.48, t * 0.12);
      object.position.y = -0.5 + reveal * 0.5 + Math.sin(t * 1.5) * 0.08;
      const orbit = smoothstep(t / DURATION);
      camera.position.x = Math.sin(orbit * Math.PI * 0.32) * 0.8;
      camera.position.z = 7.5 - orbit * 0.35;
      camera.lookAt(0, 0, 0);
      renderer.render(scene, camera);
    }

    function animate() {
      requestAnimationFrame(animate);
      if (!playing || recording) return;
      const t = clock.getElapsedTime() - startTime;
      if (t >= DURATION) {
        playing = false;
        status.textContent = 'Preview complete. Select Replay to play again.';
        renderAt(DURATION);
      } else {
        renderAt(t);
      }
    }

    function resizePreview() {
      if (recording) return;
      const width = Math.max(1, stage.clientWidth);
      const height = Math.max(1, stage.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderAt(0);
    }

    document.querySelector('#replay').addEventListener('click', () => {
      startTime = clock.getElapsedTime();
      playing = true;
      status.textContent = 'Playing preview.';
    });

    recordButton.addEventListener('click', async () => {
      if (recording) return;
      if (!('MediaRecorder' in window) || !renderer.domElement.captureStream) {
        status.textContent = 'Recording is not supported in this browser. Try a current desktop browser.';
        return;
      }
      const mimeType = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']
        .find(type => MediaRecorder.isTypeSupported(type));
      if (!mimeType) {
        status.textContent = 'No supported WebM recording codec was detected.';
        return;
      }

      const previewSize = { width: stage.clientWidth, height: stage.clientHeight };
      recording = true;
      playing = false;
      recordButton.disabled = true;
      status.textContent = 'Recording in real time… keep this tab open.';
      renderer.setPixelRatio(1);
      renderer.setSize(OUTPUT.width, OUTPUT.height, false);
      camera.aspect = OUTPUT.width / OUTPUT.height;
      camera.updateProjectionMatrix();

      const stream = renderer.domElement.captureStream(FPS);
      const chunks = [];
      let recorder;
      try {
        recorder = new MediaRecorder(stream, { mimeType });
        recorder.ondataavailable = event => { if (event.data.size) chunks.push(event.data); };
        recorder.onerror = () => { status.textContent = 'Recording failed. Check browser support and available storage.'; };
        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: mimeType });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = '3d-video.webm';
          link.click();
          setTimeout(() => URL.revokeObjectURL(url), 60_000);
          for (const track of stream.getTracks()) track.stop();
          renderer.setSize(previewSize.width, previewSize.height, false);
          camera.aspect = previewSize.width / Math.max(1, previewSize.height);
          camera.updateProjectionMatrix();
          recording = false;
          recordButton.disabled = false;
          status.textContent = 'Recording downloaded as WebM.';
          startTime = clock.getElapsedTime();
          playing = false;
          renderAt(0);
        };
        recorder.start();
        const beganAt = performance.now();
        function recordFrame(now) {
          const elapsed = (now - beganAt) / 1000;
          renderAt(elapsed);
          if (elapsed >= DURATION) {
            recorder.stop();
          } else {
            requestAnimationFrame(recordFrame);
          }
        }
        requestAnimationFrame(recordFrame);
      } catch (error) {
        for (const track of stream.getTracks()) track.stop();
        renderer.setSize(previewSize.width, previewSize.height, false);
        camera.aspect = previewSize.width / Math.max(1, previewSize.height);
        camera.updateProjectionMatrix();
        recording = false;
        recordButton.disabled = false;
        status.textContent = `Unable to start recording: ${error.message}`;
      }
    });

    new ResizeObserver(resizePreview).observe(stage);
    renderAt(0);
    status.textContent = 'Ready. Replay the preview or record a WebM.';
    animate();
  </script>
</body>
</html>
